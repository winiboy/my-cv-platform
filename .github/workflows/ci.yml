name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify (required)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  integration:
    name: Integration (required)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Starts Postgres, GoTrue, PostgREST and Storage, applying every
      # migration in supabase/migrations. Excluding the containers the suite
      # does not use keeps startup to roughly a minute.
      - name: Start Supabase
        run: pnpm supabase start -x studio,imgproxy,mailpit,realtime,vector,edge-runtime,logflare,supavisor,postgres-meta

      - name: Integration tests
        run: pnpm test:integration

      # Effective RLS behaviour. The integration suite above deliberately does
      # not cover this: each route also filters by user_id, so its ownership
      # assertions hold even with RLS disabled. This asserts the policy layer.
      - name: RLS audit
        run: |
          set -euo pipefail
          docker exec -i supabase_db_my-cv-platform \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/rls-audit.sql | tee rls-audit-output.txt
          # Match the verdict column specifically. A bare "FAIL" grep would
          # also match the word appearing in a check's intent text.
          if grep -qE '\|\s*FAIL\s*$' rls-audit-output.txt; then
            echo "::error::RLS audit reported a FAIL verdict"
            exit 1
          fi

      - name: Stop Supabase
        if: always()
        run: pnpm supabase stop --no-backup

  lint-debt-report:
    name: Lint debt (non-blocking)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Report lint debt
        continue-on-error: true
        run: |
          set +e
          pnpm lint > lint-report.txt 2>&1
          status=$?
          {
            echo "## Lint debt report"
            echo
            echo "This job is **not** a gate. It records the tracked lint debt"
            echo "described in docs/engineering/quality-contract.md."
            echo
            echo '```'
            tail -n 5 lint-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.txt

  e2e:
    name: E2E (required)
    runs-on: ubuntu-latest
    # Promoted to a required check on 2026-09-05, on evidence rather than
    # confidence: 10 consecutive runs on GitHub's hardware, each verified at
    # STEP level rather than by the job conclusion. That distinction mattered -
    # continue-on-error made the job report success even on failure, so the
    # green job badges it accumulated were not proof of anything until the
    # "Run E2E tests" step was checked directly. All 10 were genuine.
    #
    # Duration 3.98-5.36 min, so this is now the longest job. It runs in
    # parallel with Verify, which takes ~3 min, so it sets the wall clock.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only chromium. The suite declares a single chromium project, so
      # installing webkit and firefox would add minutes for browsers nothing runs.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Start Supabase
        run: pnpm supabase start -x studio,imgproxy,mailpit,realtime,vector,edge-runtime,logflare,supavisor,postgres-meta

      # playwright.config.ts builds the app and starts it itself, pinned to the
      # local stack. It refuses to run against a non-local Supabase host.
      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
